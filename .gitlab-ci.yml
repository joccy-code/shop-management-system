stages:
  - verify

test_vps_ssh:
  stage: verify
  image: alpine:3.22
  before_script:
    - apk add --no-cache openssh-client
  script:
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is missing or unavailable"
        exit 1
      elif [ ! -f "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is not a file; check its GitLab variable type"
        exit 1
      else
        echo "SSH_PRIVATE_KEY file is available"
      fi

      if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
        echo "ERROR: SSH_KNOWN_HOSTS is missing or unavailable"
        exit 1
      elif [ ! -f "$SSH_KNOWN_HOSTS" ]; then
        echo "ERROR: SSH_KNOWN_HOSTS is not a file"
        exit 1
      else
        echo "SSH_KNOWN_HOSTS file is available"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
