stages:
  - test
  - verify
  - deploy

# GitLab File variables are mode 0666 and often omit the final newline.
# OpenSSH 10 reports that as "error in libcrypto" or "bad permissions".
.setup_ssh:
  image: alpine:3.22
  before_script:
    - apk add --no-cache openssh-client
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ ! -f "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR: SSH_PRIVATE_KEY must be a File CI/CD variable"
        exit 1
      fi
      if [ -z "${SSH_KNOWN_HOSTS:-}" ] || [ ! -f "$SSH_KNOWN_HOSTS" ]; then
        echo "ERROR: SSH_KNOWN_HOSTS must be a File CI/CD variable"
        exit 1
      fi
      if [ -z "${VPS_USER:-}" ] || [ -z "${VPS_HOST:-}" ]; then
        echo "ERROR: VPS_USER and VPS_HOST must be set"
        exit 1
      fi
      install -d -m 700 "$HOME/.ssh"
      tr -d '\r' < "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
      printf '\n' >> "$HOME/.ssh/id_deploy"
      chmod 600 "$HOME/.ssh/id_deploy"
      tr -d '\r' < "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      printf '\n' >> "$HOME/.ssh/known_hosts"
      chmod 644 "$HOME/.ssh/known_hosts"
      if ! ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null; then
        echo "ERROR: SSH_PRIVATE_KEY is not a usable private key. Paste the private key, including the BEGIN and END lines, into the File variable."
        exit 1
      fi

verify_application:
  stage: test
  image: node:22
  services:
    - name: postgres:16
      alias: postgres
  variables:
    NODE_ENV: test
    POSTGRES_DB: shop_manager_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shop_manager_test?schema=public
    SESSION_SECRET: ci-session-secret-at-least-32-characters
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -U postgres && break
        sleep 2
      done
    - npm ci --cache .npm --prefer-offline --include=dev
    - npm run prisma:generate -w backend
    - npm run prisma:migrate:deploy -w backend
  script:
    - npm run typecheck
    - npm test
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

test_vps_ssh:
  extends: .setup_ssh
  stage: verify
  script:
    - |
      ssh \
        -i "$HOME/.ssh/id_deploy" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
        "$VPS_USER@$VPS_HOST" \
        'whoami && test -w /var/www/shop-management && echo "Shop deployment directory is writable"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_vps:
  extends: .setup_ssh
  stage: deploy
  resource_group: production
  needs:
    - verify_application
    - test_vps_ssh
  before_script:
    - !reference [.setup_ssh, before_script]
    - apk add --no-cache tar
  script:
    - |
      tar \
        --exclude='./.git' \
        --exclude='./node_modules' \
        --exclude='./backend/node_modules' \
        --exclude='./frontend/node_modules' \
        --exclude='./backend/.env' \
        --exclude='./frontend/.env' \
        --exclude='./backend/dist' \
        --exclude='./frontend/dist' \
        -czf /tmp/shop-management.tgz .
    - |
      ssh \
        -i "$HOME/.ssh/id_deploy" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
        "$VPS_USER@$VPS_HOST" \
        'mkdir -p /var/www/shop-management /tmp'
    - |
      scp \
        -i "$HOME/.ssh/id_deploy" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
        /tmp/shop-management.tgz \
        "$VPS_USER@$VPS_HOST:/tmp/shop-management.tgz"
    - |
      umask 077
      : > /tmp/shop-ci-env
      if [ -n "${PROD_DATABASE_URL:-}" ]; then
        printf 'DATABASE_URL=%s\n' "$PROD_DATABASE_URL" >> /tmp/shop-ci-env
      elif [ -n "${DATABASE_URL:-}" ]; then
        printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> /tmp/shop-ci-env
      fi
      if [ -n "${SESSION_SECRET:-}" ]; then
        printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET" >> /tmp/shop-ci-env
      fi
      if [ -n "${COOKIE_SECURE:-}" ]; then
        printf 'COOKIE_SECURE=%s\n' "$COOKIE_SECURE" >> /tmp/shop-ci-env
      fi
      if [ -n "${CORS_ORIGIN:-}" ]; then
        printf 'CORS_ORIGIN=%s\n' "$CORS_ORIGIN" >> /tmp/shop-ci-env
      fi
    - |
      scp \
        -i "$HOME/.ssh/id_deploy" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
        /tmp/shop-ci-env \
        "$VPS_USER@$VPS_HOST:/tmp/shop-ci-env"
    - |
      ssh \
        -i "$HOME/.ssh/id_deploy" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
        "$VPS_USER@$VPS_HOST" \
        'tar -xzf /tmp/shop-management.tgz -C /var/www/shop-management && rm -f /tmp/shop-management.tgz && CI_ENV_FILE=/tmp/shop-ci-env bash /var/www/shop-management/scripts/remote-deploy.sh'
  environment:
    name: production
    url: http://$VPS_HOST
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
